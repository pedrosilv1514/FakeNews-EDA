[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-classifier"
version = "0.1.0"
description = "EDA reprodutivel de datasets brasileiros de noticias falsas e verdadeiras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "datasets>=3.0,<5",
  "pyarrow>=17,<24",
  "PyYAML>=6.0,<7",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = ["jupyter>=1.1,<2", "pytest>=8.3,<10"]

[project.scripts]
fake-news-prepare = "src.data.make_dataset:main"
fake-news-eda = "src.analysis.pipeline:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
